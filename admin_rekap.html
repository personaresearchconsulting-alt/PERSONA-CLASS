<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Rekap — Persona Class</title>

<style>

:root{
    --cream:#FAF9F6;
    --cream2:#F4EEE6;
    --rose:#C9A6A6;
    --lavender:#B8B1C8;
    --navy:#172033;
    --white:#FFFFFF;
    --text:#202535;
    --muted:#777;
    --red:#C94C4C;
    --green:#3D8B68;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--cream);
    color:var(--text);
}

.container{
    width:min(1400px,94%);
    margin:40px auto;
}


/* =====================================================
   LOGIN ADMIN
   ===================================================== */

.admin-login{
    min-height:70vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-card{
    width:min(430px,100%);
    background:var(--white);
    border-radius:22px;
    padding:38px 32px;
    box-shadow:0 12px 35px rgba(23,32,51,.10);
    text-align:center;
}

.login-card h1{
    margin:0 0 8px;
    color:var(--navy);
    font-size:25px;
}

.login-card p{
    margin:0 0 28px;
    color:var(--muted);
    font-size:14px;
}

.pin-input{
    width:100%;
    padding:15px 16px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:18px;
    text-align:center;
    letter-spacing:5px;
    outline:none;
}

.pin-input:focus{
    border-color:var(--rose);
}

.btn{
    border:none;
    border-radius:11px;
    padding:13px 20px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.btn-primary{
    width:100%;
    margin-top:15px;
    background:var(--navy);
    color:white;
}

.btn-primary:hover{
    opacity:.92;
}

.login-error{
    color:var(--red);
    font-size:13px;
    margin-top:15px;
    min-height:18px;
}


/* =====================================================
   ADMIN CONTENT
   ===================================================== */

#adminContent{
    display:none;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.header h1{
    margin:0;
    color:var(--navy);
    font-size:28px;
}

.header p{
    margin:6px 0 0;
    color:var(--muted);
    font-size:14px;
}

.header-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn-small{
    background:var(--navy);
    color:white;
}

.btn-download{
    background:var(--rose);
    color:white;
}

.btn-logout{
    background:#eee;
    color:var(--navy);
}


/* =====================================================
   SUMMARY
   ===================================================== */

.summary{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:15px;
    margin-bottom:22px;
}

.summary-card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:
        0 8px 25px
        rgba(23,32,51,.06);
}

.summary-label{
    font-size:13px;
    color:var(--muted);
    margin-bottom:8px;
}

.summary-value{
    font-size:28px;
    font-weight:bold;
    color:var(--navy);
}


/* =====================================================
   FILTER
   ===================================================== */

.toolbar{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:20px;

    display:flex;
    flex-wrap:wrap;
    gap:10px;

    box-shadow:
        0 8px 25px
        rgba(23,32,51,.06);
}

.toolbar input,
.toolbar select{
    border:1px solid #ddd;
    border-radius:10px;
    padding:11px 13px;
    outline:none;
    background:white;
    color:var(--text);
}

.toolbar input{
    flex:1;
    min-width:220px;
}

.toolbar select{
    min-width:140px;
}


/* =====================================================
   TABLE
   ===================================================== */

.table-wrap{
    background:white;
    border-radius:18px;
    overflow:auto;
    box-shadow:
        0 8px 25px
        rgba(23,32,51,.06);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

thead{
    background:var(--navy);
    color:white;
}

th,
td{
    padding:13px 12px;
    text-align:left;
    border-bottom:1px solid #eee;
    font-size:13px;
    vertical-align:top;
}

th{
    white-space:nowrap;
    font-size:12px;
}

tbody tr:hover{
    background:#faf8f5;
}

.score-red{
    color:var(--red);
    font-weight:bold;
}

.score-normal{
    color:#3D67A8;
    font-weight:bold;
}

.total-score{
    color:var(--green);
    font-weight:bold;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    background:var(--cream2);
}

.empty{
    text-align:center;
    padding:45px 20px;
    color:var(--muted);
}

.status{
    margin-bottom:15px;
    color:var(--muted);
    font-size:13px;
}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media(max-width:700px){

    .container{
        width:94%;
        margin:25px auto;
    }

    .header{
        align-items:flex-start;
        flex-direction:column;
    }

    .summary{
        grid-template-columns:1fr;
    }

    .header-actions{
        width:100%;
    }

    .header-actions .btn{
        flex:1;
    }

    .login-card{
        padding:30px 22px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN ADMIN
     ===================================================== -->

<div class="container">

    <div id="adminLogin" class="admin-login">

        <div class="login-card">

            <h1>Area Pengelola</h1>

            <p>
                Masukkan PIN admin untuk melihat
                rekap hasil Persona Class.
            </p>

            <input
                type="password"
                id="pinInput"
                class="pin-input"
                placeholder="PIN Admin"
                maxlength="20"
                inputmode="numeric"
                autocomplete="off"
            >

            <button
                class="btn btn-primary"
                onclick="loginAdmin()"
            >
                MASUK REKAP
            </button>

            <div
                id="loginError"
                class="login-error"
            ></div>

        </div>

    </div>


    <!-- =================================================
         ADMIN CONTENT
         ================================================= -->

    <div id="adminContent">

        <div class="header">

            <div>

                <h1>Rekap Persona Class</h1>

                <p>
                    Data hasil latihan dan tryout siswa.
                </p>

            </div>


            <div class="header-actions">

                <button
                    class="btn btn-download"
                    onclick="downloadCSV()"
                >
                    ↓ Download Rekap
                </button>

                <button
                    class="btn btn-small"
                    onclick="loadData()"
                >
                    ↻ Refresh
                </button>

                <button
                    class="btn btn-logout"
                    onclick="logoutAdmin()"
                >
                    Keluar
                </button>

            </div>

        </div>


        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-card">

                <div class="summary-label">
                    Total Data
                </div>

                <div
                    class="summary-value"
                    id="totalData"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Jumlah Siswa
                </div>

                <div
                    class="summary-value"
                    id="totalStudents"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Rata-rata Nilai
                </div>

                <div
                    class="summary-value"
                    id="averageScore"
                >
                    0
                </div>

            </div>

        </div>


        <!-- FILTER -->

        <div class="toolbar">

            <input
                type="text"
                id="searchInput"
                placeholder="Cari nama, sub tes, materi, atau nama tes..."
                oninput="renderTable()"
            >


            <select
                id="activityFilter"
                onchange="renderTable()"
            >

                <option value="">
                    Semua Aktivitas
                </option>

                <option value="LATIHAN">
                    LATIHAN
                </option>

                <option value="TRYOUT">
                    TRYOUT
                </option>

            </select>


            <select
                id="groupFilter"
                onchange="renderTable()"
            >

                <option value="">
                    Semua Kelompok
                </option>

                <option value="Kecerdasan">
                    Kecerdasan
                </option>

                <option value="Kepribadian">
                    Kepribadian
                </option>

                <option value="Kecermatan">
                    Kecermatan
                </option>

            </select>


            <button
                class="btn btn-small"
                onclick="resetFilter()"
            >
                Reset Filter
            </button>

        </div>


        <div
            class="status"
            id="statusText"
        >
            Memuat data...
        </div>


        <!-- TABLE -->

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>No</th>
                        <th>Tanggal</th>
                        <th>Nama</th>
                        <th>Kode</th>
                        <th>Aktivitas</th>
                        <th>Kelompok</th>
                        <th>Sub Tes</th>
                        <th>Materi</th>
                        <th>Nama Tes</th>
                        <th>Nilai</th>
                        <th>Total</th>
                        <th>Keterangan</th>

                    </tr>

                </thead>


                <tbody id="tableBody">

                    <tr>

                        <td
                            colspan="12"
                            class="empty"
                        >
                            Memuat data...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>


/* =====================================================
   APPS SCRIPT URL
   ===================================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxzzajqlZMq2qOSgxoLAvdpTeMgAOSDCJmkqZvIy0uMxfgPfCxlXNNKotDquzHmkqUa/exec";


let allData = [];

let adminPin = "";


/* =====================================================
   LOGIN
   ===================================================== */

async function loginAdmin(){

    const input =
        document
        .getElementById("pinInput");

    const error =
        document
        .getElementById("loginError");

    const pin =
        input.value.trim();


    error.textContent = "";


    if(!pin){

        error.textContent =
            "Masukkan PIN admin.";

        input.focus();

        return;

    }


    try{

        const url =
            SCRIPT_URL +
            "?mode=admin&adminPin=" +
            encodeURIComponent(pin);


        const response =
            await fetch(url);


        const data =
            await response.json();


        if(
            data.status !==
            "success"
        ){

            error.textContent =
                data.message ||
                "PIN admin salah.";

            input.select();

            return;

        }


        /*
         * PIN benar.
         * Simpan hanya selama halaman aktif.
         */

        adminPin = pin;


        document
        .getElementById("adminLogin")
        .style.display = "none";


        document
        .getElementById("adminContent")
        .style.display = "block";


        allData =
            data.results || [];


        updateSummary();

        renderTable();


        document
        .getElementById("statusText")
        .textContent =
            "Data berhasil dimuat: " +
            allData.length +
            " record.";


    }catch(error){

        console.error(error);

        error =
            document
            .getElementById("loginError");

        error.textContent =
            "Tidak dapat terhubung ke server.";

    }

}


/* =====================================================
   ENTER = LOGIN
   ===================================================== */

document
.getElementById("pinInput")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            loginAdmin();

        }

    }
);


/* =====================================================
   LOAD DATA
   ===================================================== */

async function loadData(){

    if(!adminPin){

        return;

    }


    const status =
        document
        .getElementById("statusText");


    status.textContent =
        "Memuat data...";


    try{

        const url =
            SCRIPT_URL +
            "?mode=admin&adminPin=" +
            encodeURIComponent(
                adminPin
            );


        const response =
            await fetch(url);


        const data =
            await response.json();


        if(
            data.status !==
            "success"
        ){

            status.textContent =
                data.message ||
                "Gagal memuat data.";

            return;

        }


        allData =
            data.results || [];


        updateSummary();

        renderTable();


        status.textContent =
            "Data berhasil dimuat: " +
            allData.length +
            " record.";


    }catch(error){

        console.error(error);

        status.textContent =
            "Gagal mengambil data.";

    }

}


/* =====================================================
   SUMMARY
   ===================================================== */

function updateSummary(){

    document
    .getElementById("totalData")
    .textContent =
        allData.length;


    const students =
        new Set();


    let totalScore = 0;

    let scoreCount = 0;


    allData.forEach(function(row){

        if(row.name){

            students.add(
                row.name
            );

        }


        const score =
            parseFloat(
                String(row.value)
                .replace(",", ".")
            );


        if(
            !isNaN(score)
        ){

            totalScore += score;

            scoreCount++;

        }

    });


    document
    .getElementById("totalStudents")
    .textContent =
        students.size;


    document
    .getElementById("averageScore")
    .textContent =
        scoreCount
            ? (
                totalScore /
                scoreCount
              ).toFixed(1)
            : "0";

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value){

    return String(
        value == null
            ? ""
            : value
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   SCORE CLASS
   ===================================================== */

function scoreClass(value){

    const score =
        parseFloat(
            String(value)
            .replace(",", ".")
        );


    if(
        !isNaN(score) &&
        score < 60
    ){

        return "score-red";

    }


    return "score-normal";

}


/* =====================================================
   ACTIVITY BADGE
   ===================================================== */

function activityBadge(value){

    if(!value){

        return "-";

    }


    return `
        <span class="badge">
            ${escapeHtml(value)}
        </span>
    `;

}


/* =====================================================
   RENDER TABLE
   ===================================================== */

function renderTable(){

    const body =
        document
        .getElementById("tableBody");


    const search =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const activity =
        document
        .getElementById("activityFilter")
        .value
        .toLowerCase();


    const group =
        document
        .getElementById("groupFilter")
        .value
        .toLowerCase();


    const filtered =
        allData.filter(
            function(row){

                const text =
                    [
                        row.name,
                        row.subtest,
                        row.material,
                        row.test,
                        row.code
                    ]
                    .join(" ")
                    .toLowerCase();


                const rowActivity =
                    String(
                        row.activity || ""
                    )
                    .toLowerCase();


                const rowGroup =
                    String(
                        row.group || ""
                    )
                    .toLowerCase();


                const searchMatch =
                    !search ||
                    text.includes(search);


                const activityMatch =
                    !activity ||
                    rowActivity === activity;


                const groupMatch =
                    !group ||
                    rowGroup === group;


                return (
                    searchMatch &&
                    activityMatch &&
                    groupMatch
                );

            }
        );


    if(
        filtered.length === 0
    ){

        body.innerHTML = `

            <tr>

                <td
                    colspan="12"
                    class="empty"
                >
                    Tidak ada data yang sesuai.

                </td>

            </tr>

        `;

        return;

    }


    body.innerHTML =
        filtered
        .map(
            function(row,index){

                const score =
                    escapeHtml(
                        row.value
                    );


                const total =
                    escapeHtml(
                        row.total
                    );


                return `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.date
                            )}
                        </td>

                        <td>
                            <strong>
                                ${escapeHtml(
                                    row.name
                                )}
                            </strong>
                        </td>

                        <td>
                            ${escapeHtml(
                                row.code
                            )}
                        </td>

                        <td>
                            ${activityBadge(
                                row.activity
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.group
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.subtest
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.material
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.test
                            )}
                        </td>

                        <td class="${scoreClass(
                            row.value
                        )}">
                            ${score}
                        </td>

                        <td class="total-score">
                            ${total}
                        </td>

                        <td>
                            ${escapeHtml(
                                row.note
                            )}
                        </td>

                    </tr>

                `;

            }
        )
        .join("");

}


/* =====================================================
   RESET FILTER
   ===================================================== */

function resetFilter(){

    document
    .getElementById("searchInput")
    .value = "";


    document
    .getElementById("activityFilter")
    .value = "";


    document
    .getElementById("groupFilter")
    .value = "";


    renderTable();

}


/* =====================================================
   DOWNLOAD CSV
   ===================================================== */

function downloadCSV(){

    if(
        !allData ||
        allData.length === 0
    ){

        alert(
            "Belum ada data untuk di-download."
        );

        return;

    }


    const search =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const activity =
        document
        .getElementById("activityFilter")
        .value
        .toLowerCase();


    const group =
        document
        .getElementById("groupFilter")
        .value
        .toLowerCase();


    const filtered =
        allData.filter(
            function(row){

                const text =
                    [
                        row.name,
                        row.subtest,
                        row.material,
                        row.test,
                        row.code
                    ]
                    .join(" ")
                    .toLowerCase();


                const rowActivity =
                    String(
                        row.activity || ""
                    )
                    .toLowerCase();


                const rowGroup =
                    String(
                        row.group || ""
                    )
                    .toLowerCase();


                return (

                    (!search ||
                        text.includes(search))

                    &&

                    (!activity ||
                        rowActivity === activity)

                    &&

                    (!group ||
                        rowGroup === group)

                );

            }
        );


    if(
        filtered.length === 0
    ){

        alert(
            "Tidak ada data sesuai filter."
        );

        return;

    }


    const headers = [

        "No",
        "Timestamp",
        "Kode Siswa",
        "Nama Siswa",
        "Jenis Aktivitas",
        "Kelompok",
        "Sub Tes",
        "Materi",
        "Nama Tes",
        "Tanggal",
        "Nilai",
        "Total",
        "Keterangan"

    ];


    const rows = [

        headers

    ];


    filtered.forEach(
        function(row,index){

            rows.push([

                index + 1,

                row.timestamp || "",

                row.code || "",

                row.name || "",

                row.activity || "",

                row.group || "",

                row.subtest || "",

                row.material || "",

                row.test || "",

                row.date || "",

                row.value || "",

                row.total || "",

                row.note || ""

            ]);

        }
    );


    const csv =
        rows
        .map(
            function(row){

                return row
                .map(
                    function(value){

                        return '"' +
                            String(
                                value == null
                                    ? ""
                                    : value
                            )
                            .replace(
                                /"/g,
                                '""'
                            ) +
                            '"';

                    }
                )
                .join(",");

            }
        )
        .join("\r\n");


    const blob =
        new Blob(
            [
                "\uFEFF" +
                csv
            ],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement("a");


    const today =
        new Date()
        .toISOString()
        .slice(0,10);


    link.href = url;

    link.download =
        "rekap-prc-class-" +
        today +
        ".csv";


    document
    .body
    .appendChild(link);


    link.click();


    document
    .body
    .removeChild(link);


    URL.revokeObjectURL(
        url
    );

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logoutAdmin(){

    adminPin = "";

    allData = [];


    document
    .getElementById("adminContent")
    .style.display = "none";


    document
    .getElementById("adminLogin")
    .style.display = "flex";


    document
    .getElementById("pinInput")
    .value = "";


    document
    .getElementById("loginError")
    .textContent = "";


    document
    .getElementById("tableBody")
    .innerHTML = "";


    document
    .getElementById("totalData")
    .textContent = "0";


    document
    .getElementById("totalStudents")
    .textContent = "0";


    document
    .getElementById("averageScore")
    .textContent = "0";


    document
    .getElementById("pinInput")
    .focus();

}

</script>

</body>
</html>
